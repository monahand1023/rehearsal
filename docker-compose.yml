# Fully-local rehearsal: the app + Ollama, both in containers. Nothing leaves your machine.
#
#   docker compose up -d
#   docker compose exec ollama ollama pull qwen2.5:7b   # one-time model download
#   open http://localhost:8742
#
# The coach voice uses your browser's built-in speech (Web Speech API) — no TTS service needed.
services:
  ollama:
    image: ollama/ollama
    volumes:
      - ollama_data:/root/.ollama
    # No host port: the app reaches Ollama over the internal Docker network only, so the
    # (auth-less) Ollama API is never exposed to your LAN. Use `docker compose exec ollama …`
    # to pull models. Add `ports: ["127.0.0.1:11434:11434"]` if you want host access.
    restart: unless-stopped

  app:
    build: .
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434          # the Ollama client talks to the service
      REHEARSAL_LLM_MODEL: ${REHEARSAL_LLM_MODEL:-qwen2.5:7b}
      REHEARSAL_PORT: "8742"
    ports:
      - "127.0.0.1:8742:8742"                    # localhost only — not exposed to your network
    volumes:
      - whisper_cache:/cache                     # persist the downloaded Whisper model
    restart: unless-stopped

volumes:
  ollama_data:
  whisper_cache:
