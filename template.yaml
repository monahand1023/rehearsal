AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: rehearsal - gated JP/STAMP practice (zip Lambda + Function URL, pure-Python)

Parameters:
  OpenAIApiKey: { Type: String, NoEcho: true }
  ElevenLabsApiKey: { Type: String, NoEcho: true }
  AccessCode: { Type: String, NoEcho: true }
  SessionSecret: { Type: String, NoEcho: true }

Globals:
  Function:
    Timeout: 60
    MemorySize: 1024
    Runtime: python3.12
    Architectures: [arm64]

Resources:
  RehearsalFn:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      Handler: web.lambda_handler.handler
      CodeUri: .
      ReservedConcurrentExecutions: 5
      FunctionUrlConfig:
        AuthType: NONE
      Policies:
        - S3WritePolicy:
            BucketName: !Sub "rehearsal-recordings-${AWS::AccountId}"
      Environment:
        Variables:
          REHEARSAL_AUDIO_NATIVE: "false"
          REHEARSAL_MAX_UPLOAD_BYTES: "4194304"   # 4 MB — a 3-min Opus clip is ~1-2 MB; caps Whisper cost/abuse
          REHEARSAL_TRACKS: language_jp
          REHEARSAL_RECORDINGS_BUCKET: !Ref RecordingsBucket
          REHEARSAL_LLM_PROVIDER: openai
          REHEARSAL_TRANSCRIBE_PROVIDER: openai
          REHEARSAL_COOKIE_SECURE: "true"
          REHEARSAL_UNLOCK_DELAY: "3.0"
          OPENAI_API_KEY: !Ref OpenAIApiKey
          ELEVENLABS_API_KEY: !Ref ElevenLabsApiKey
          ELEVENLABS_VOICE_EN: UgBBYS2sOqTuMpoF3BR0
          ELEVENLABS_VOICE_JA: MXKtCrra8fvlDUbfKUT1
          REHEARSAL_ACCESS_CODE: !Ref AccessCode
          REHEARSAL_SESSION_SECRET: !Ref SessionSecret

  RecordingsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain          # keep the training corpus if the stack is deleted
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "rehearsal-recordings-${AWS::AccountId}"
      BucketEncryption:             # encrypt every object at rest (SSE-S3 / AES256)
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:   # private — no public access ever
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

Outputs:
  FunctionUrl:
    Description: The public app URL
    Value: !GetAtt RehearsalFnUrl.FunctionUrl
