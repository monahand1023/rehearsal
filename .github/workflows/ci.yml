name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Cache Whisper models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: whisper-models-${{ hashFiles('engine/transcribe.py') }}
      - name: Install
        run: pip install -r requirements.txt
      - name: Test (keyless; the live-model calibration and cloud suites skip)
        run: pytest -k "not ollama" -q
